<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASN Membership Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginBox" class="login-box">
  <h2>ASN Membership Card</h2>
  <p>Enter your personal password to access your card.</p>
  <input id="passwordInput" type="password" placeholder="Password" autocomplete="off">
  <button id="loginButton">Open my card</button>
  <p id="error" class="error"></p>
</div>

<div id="cardArea" class="hidden">
  <div class="instruction">Click the card to flip</div>

  <div class="card" id="flipCard">
    <div class="card-inner">
      <div class="card-front">
        <img id="frontImage" alt="Membership card front">
      </div>
      <div class="card-back">
        <img id="backImage" alt="Membership card back">
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
